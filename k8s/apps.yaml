apiVersion: v1
kind: Namespace
metadata:
  name: apps
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fundoo-config
  namespace: apps
data:
  Jwt__Issuer: fundoo-user-api
  Jwt__Audience: fundoo-clients
  Redis__ConnectionString: redis:6379,abortConnect=false
  NotificationService__BaseUrl: http://notification-service:8080/
  Kafka__BootstrapServers: kafka:9092
  Kafka__Topics__NoteCreated: notes.created.v1
  Kafka__Topics__NoteUpdated: notes.updated.v1
  Kafka__ConsumerGroupId: fundoo-notifications-v1
  Kafka__DeadLetterTopic: notes.events.dead-letter.v1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: apps
spec:
  replicas: 1
  selector: { matchLabels: { app: user-service } }
  template:
    metadata: { labels: { app: user-service } }
    spec:
      containers:
        - name: user-service
          image: fundoo-user:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: fundoo-config } }]
          env:
            - { name: ConnectionStrings__UserDb, valueFrom: { secretKeyRef: { name: fundoo-secrets, key: user-db } } }
            - { name: Jwt__SigningKey, valueFrom: { secretKeyRef: { name: fundoo-secrets, key: jwt-signing-key } } }
            - { name: Authentication__Google__ClientId, valueFrom: { secretKeyRef: { name: fundoo-secrets, key: google-client-id } } }
            - { name: Authentication__Google__ClientSecret, valueFrom: { secretKeyRef: { name: fundoo-secrets, key: google-client-secret } } }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
          readinessProbe: { httpGet: { path: /health/ready, port: http }, initialDelaySeconds: 10, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health/live, port: http }, initialDelaySeconds: 20, periodSeconds: 20 }
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: apps
spec:
  type: ClusterIP
  selector: { app: user-service }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-service
  namespace: apps
spec:
  replicas: 1
  selector: { matchLabels: { app: notes-service } }
  template:
    metadata: { labels: { app: notes-service } }
    spec:
      containers:
        - name: notes-service
          image: fundoo-notes:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: fundoo-config } }]
          env:
            - { name: ConnectionStrings__NotesDb, valueFrom: { secretKeyRef: { name: fundoo-secrets, key: notes-db } } }
            - { name: Jwt__SigningKey, valueFrom: { secretKeyRef: { name: fundoo-secrets, key: jwt-signing-key } } }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
          readinessProbe: { httpGet: { path: /health/ready, port: http }, initialDelaySeconds: 10, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health/live, port: http }, initialDelaySeconds: 20, periodSeconds: 20 }
---
apiVersion: v1
kind: Service
metadata:
  name: notes-service
  namespace: apps
spec:
  type: ClusterIP
  selector: { app: notes-service }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: apps
spec:
  replicas: 1
  selector: { matchLabels: { app: notification-service } }
  template:
    metadata: { labels: { app: notification-service } }
    spec:
      containers:
        - name: notification-service
          image: fundoo-notification:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: fundoo-config } }]
          env:
            - { name: EmailSettings__Host, valueFrom: { secretKeyRef: { name: fundoo-secrets, key: smtp-host } } }
            - { name: EmailSettings__Port, valueFrom: { secretKeyRef: { name: fundoo-secrets, key: smtp-port } } }
            - { name: EmailSettings__SenderEmail, valueFrom: { secretKeyRef: { name: fundoo-secrets, key: smtp-sender-email } } }
            - { name: EmailSettings__Username, valueFrom: { secretKeyRef: { name: fundoo-secrets, key: smtp-username } } }
            - { name: EmailSettings__Password, valueFrom: { secretKeyRef: { name: fundoo-secrets, key: smtp-password } } }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
          readinessProbe: { httpGet: { path: /health/ready, port: http }, initialDelaySeconds: 10, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health/live, port: http }, initialDelaySeconds: 20, periodSeconds: 20 }
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: apps
spec:
  type: ClusterIP
  selector: { app: notification-service }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: apps
spec:
  replicas: 1
  selector: { matchLabels: { app: api-gateway } }
  template:
    metadata: { labels: { app: api-gateway } }
    spec:
      containers:
        - name: api-gateway
          image: fundoo-api-gateway:1.0.0
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
          readinessProbe: { httpGet: { path: /health/ready, port: http }, initialDelaySeconds: 10, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health/live, port: http }, initialDelaySeconds: 20, periodSeconds: 20 }
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: apps
spec:
  type: ClusterIP
  selector: { app: api-gateway }
  ports: [{ name: http, port: 8080, targetPort: http }]
