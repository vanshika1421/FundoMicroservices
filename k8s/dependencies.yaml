apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: apps
data:
  01-notes.sql: |
    CREATE DATABASE fundoo_notes;
    \connect fundoo_notes
    CREATE TABLE IF NOT EXISTS notes (id uuid PRIMARY KEY, user_id uuid NOT NULL, title text NOT NULL, content text NOT NULL, color text NULL, is_pinned boolean NOT NULL DEFAULT false, is_archived boolean NOT NULL DEFAULT false, is_trashed boolean NOT NULL DEFAULT false, created_at_utc timestamptz NOT NULL, updated_at_utc timestamptz NOT NULL);
    CREATE INDEX IF NOT EXISTS ix_notes_user_created ON notes (user_id, created_at_utc DESC);
    CREATE INDEX IF NOT EXISTS ix_notes_user_active ON notes (user_id, is_pinned DESC, created_at_utc DESC) WHERE is_archived = false AND is_trashed = false;
    CREATE TABLE IF NOT EXISTS labels (id uuid PRIMARY KEY, user_id uuid NOT NULL, name text NOT NULL);
    CREATE INDEX IF NOT EXISTS ix_labels_user_name ON labels (user_id, name);
    CREATE TABLE IF NOT EXISTS note_labels (note_id uuid NOT NULL REFERENCES notes (id) ON DELETE CASCADE, label_id uuid NOT NULL REFERENCES labels (id) ON DELETE CASCADE, PRIMARY KEY (note_id, label_id));
    CREATE INDEX IF NOT EXISTS ix_note_labels_label ON note_labels (label_id);
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: apps
spec:
  serviceName: postgres
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16.16-bookworm
          imagePullPolicy: IfNotPresent
          ports: [{ name: db, containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: fundoo_users }
            - { name: POSTGRES_USER, value: fundoo }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: fundoo-secrets, key: postgres-password } } }
          resources: { requests: { cpu: 200m, memory: 256Mi }, limits: { cpu: 1000m, memory: 1Gi } }
          readinessProbe: { exec: { command: ["sh", "-c", "pg_isready -U fundoo -d fundoo_users"] }, initialDelaySeconds: 10, periodSeconds: 5 }
          livenessProbe: { exec: { command: ["sh", "-c", "pg_isready -U fundoo -d fundoo_users"] }, initialDelaySeconds: 30, periodSeconds: 10 }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d/01-notes.sql, subPath: 01-notes.sql, readOnly: true }
      volumes:
        - name: init
          configMap: { name: postgres-init }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 8Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: apps
spec:
  type: ClusterIP
  selector: { app: postgres }
  ports: [{ name: db, port: 5432, targetPort: db }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: apps
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7.4.11-alpine
          imagePullPolicy: IfNotPresent
          args: ["redis-server", "--save", "", "--appendonly", "no"]
          ports: [{ name: redis, containerPort: 6379 }]
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 250m, memory: 256Mi } }
          readinessProbe: { exec: { command: ["redis-cli", "ping"] }, periodSeconds: 5 }
          livenessProbe: { exec: { command: ["redis-cli", "ping"] }, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: apps
spec:
  type: ClusterIP
  selector: { app: redis }
  ports: [{ name: redis, port: 6379, targetPort: redis }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: apps
spec:
  replicas: 1
  selector: { matchLabels: { app: kafka } }
  template:
    metadata: { labels: { app: kafka } }
    spec:
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: kafka-data }
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.8.0
          imagePullPolicy: IfNotPresent
          ports: [{ name: kafka, containerPort: 9092 }]
          volumeMounts:
            - { name: data, mountPath: /var/lib/kafka/data }
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: 1@kafka:29093 }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: PLAINTEXT://kafka:9092 }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: PLAINTEXT }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: CLUSTER_ID, value: MkU3OEVBNTcwNTJENDM2Qk }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "true" }
          resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: 1500m, memory: 2Gi } }
          readinessProbe: { tcpSocket: { port: kafka }, initialDelaySeconds: 30, periodSeconds: 10 }
          livenessProbe: { tcpSocket: { port: kafka }, initialDelaySeconds: 60, periodSeconds: 20 }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-data
  namespace: apps
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: apps
spec:
  type: ClusterIP
  selector: { app: kafka }
  ports: [{ name: kafka, port: 9092, targetPort: kafka }]
